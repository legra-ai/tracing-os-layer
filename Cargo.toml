[package]
name = "tracing-os-layer"
version = "0.2.1"
edition = "2024"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Cross-platform OS-native logging layer for tracing"
repository = "https://github.com/legra-ai/tracing-os-layer"
homepage = "https://github.com/legra-ai/tracing-os-layer"
documentation = "https://docs.rs/tracing-os-layer"
keywords = ["tracing", "logging", "journald", "os-log", "observability"]
categories = ["development-tools::debugging", "os"]
readme = "README.md"
build = "build.rs"

[lib]
doctest = true

[dependencies]
tracing-core = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tracing = "0.1"

[build-dependencies]
cc = "1"
rhusky = "0.0.6"

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
eventlog = "0.4"
log = "0.4"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
